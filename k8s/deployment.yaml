apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-java-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docker-java-app
  template:
    metadata:
      labels:
        app: docker-java-app
    spec:
      containers:
        - name: app
          image: docker-java-sample:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /?name=health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /?name=health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: docker-java-svc
spec:
  type: NodePort
  selector:
    app: docker-java-app
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080